name: Build Windows (Qt6 + libmpv)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_store_msix:
        description: 'Partner Center identity로 Store 제출용 unsigned MSIX 생성'
        required: false
        default: false
        type: boolean
      build_local_test_msix:
        description: '현재 담당자 PC 전용 self-signed MSIX 생성 — 절대 고객 배포 금지'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      # ── 소스 체크아웃 ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 릴리즈 게이트가 직전 태그 이후의 변경 파일을 비교해야 한다.
          fetch-depth: 0

      # ── 버전 일치 검증 ────────────────────────────────────────────
      # CMakeLists.txt / UpdateChecker.h / build-windows.yml 세 곳의 버전이
      # 모두 일치하지 않으면 빌드를 즉시 중단합니다.
      - name: Verify version consistency
        shell: bash
        run: |
          CMAKE_VER=$(grep -oP '(?<=project\(Sorinuri VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          CHECKER_VER=$(grep -oP '(?<=currentVersion\(\) \{ return ")[0-9]+\.[0-9]+\.[0-9]+' src/UpdateChecker.h | head -1)
          YML_VER=$(grep -oP '(?<=APP_VERSION:\s")[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/build-windows.yml | head -1)
          echo "CMakeLists.txt : $CMAKE_VER"
          echo "UpdateChecker.h: $CHECKER_VER"
          echo "build-windows.yml: $YML_VER"
          if [ "$CMAKE_VER" != "$CHECKER_VER" ] || [ "$CMAKE_VER" != "$YML_VER" ]; then
            echo ""
            echo "========================================"
            echo "오류: 버전 불일치가 감지됐습니다!"
            echo "  CMakeLists.txt  : $CMAKE_VER"
            echo "  UpdateChecker.h : $CHECKER_VER"
            echo "  build-windows.yml: $YML_VER"
            echo ""
            echo "해결 방법: python3 scripts/bump_version.py <버전> 실행 후 재커밋"
            echo "========================================"
            exit 1
          fi
          echo "버전 검증 통과: $CMAKE_VER"

      # ── MSIX 버전 단일 원본 검증 ───────────────────────────────────
      # 모든 MSIX 변형은 CMake의 제품 버전만 사용하며, 패키징 전에 네 자리 형식을 강제한다.
      - name: Verify MSIX version derivation
        shell: pwsh
        run: |
          $projectText = Get-Content 'CMakeLists.txt' -Raw
          if ($projectText -notmatch 'project\(Sorinuri\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'MSIX 버전 생성 중단: CMakeLists.txt에서 Sorinuri 제품 버전을 찾을 수 없습니다'
          }
          $msixVersion = "$($Matches[1]).0"
          if ($msixVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "MSIX 버전 생성 중단: 유효하지 않은 네 자리 버전입니다: $msixVersion"
          }
          "MSIX_VERSION=$msixVersion" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          Write-Host "MSIX 버전 검증 통과: $msixVersion"

      # ── 릴리즈 변경 범위 게이트 ────────────────────────────────────
      - name: Verify declared release scope
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_release_gate.py

      # ── 사전 테스트 배포·production 격리 검증 ───────────────────────
      - name: Verify pre-production test release isolation
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_preproduction_test_release.py

      # ── 오디오 출력 정책 회귀 검증 ──────────────────────────────────
      - name: Verify multichannel audio policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_audio_policy.py

      - name: Verify multi-instance shared PCM policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_multi_instance_audio.py

      # ── 절전 복귀 오디오·새 파일 자막 스타일 회귀 검증 ───────────────
      - name: Verify audio resume and subtitle lifecycle
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_audio_resume_subtitle.py

      # ── 첫 프레임·지연 MPV 초기화·초기 파일 재생 회귀 검증 ───────────
      - name: Verify startup responsiveness
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_startup_responsiveness.py

      # ── Windows Snap·유휴 반응성 회귀 검증 ───────────────────────────
      - name: Verify Windows Snap and idle responsiveness
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_window_snap_responsiveness.py

      # ── 통합 디자인 시스템·HiDPI 버튼 포커스 검증 ─────────────────────
      - name: Verify unified UI design system
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_ui_design_system.py

      # ── 파일 연결·Windows 기본 앱 등록 검증 ──────────────────────────
      - name: Verify file association policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_file_associations.py

      # ── 자동 업데이트 설치 경로·실행 실패 복구 검증 ───────────────────
      - name: Verify update installation flow
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_update_install_flow.py

      # ── Microsoft Store MSIX 구조·자체 업데이트 격리 검증 ───────────────
      - name: Verify Microsoft Store MSIX package policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_msix_store_package.py

      # ── 통합 재생 대기열·YouTube·반복 모드 회귀 검증 ──────────────────
      - name: Verify unified playback queue
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_playback_queue.py

      # ── 오리지널 음악 장르·상황 분류 및 전체/선택 재생 회귀 검증 ──────
      - name: Verify Originals browsing and selected playback
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_originals_browsing_playback.py

      # ── Visual Studio 환경 설정 ────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Qt6 설치 ───────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: ''
          cache: true

      # ── libmpv 다운로드 ────────────────────────────────────────────
      - name: Download libmpv
        shell: pwsh
        run: |
          # 여러 소스를 시도하는 방식으로 안정성 확보
          $downloaded = $false

          # 소스 1: shinchiro
          try {
            $releases = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases?per_page=5" -TimeoutSec 30
            $devAsset = $null
            foreach ($rel in $releases) {
              foreach ($asset in $rel.assets) {
                if ($asset.name -match "mpv-dev-x86_64.*\.7z$") {
                  $devAsset = $asset; break
                }
              }
              if ($devAsset) { break }
            }
            if ($devAsset) {
              Write-Host "소스 1 (shinchiro): $($devAsset.name)"
              Invoke-WebRequest -Uri $devAsset.browser_download_url -OutFile "mpv-dev.7z" -TimeoutSec 180
              $downloaded = $true
            }
          } catch {
            Write-Host "소스 1 실패: $_"
          }

          # 소스 2: zhongfly (shinchiro 실패 시 대체)
          if (-not $downloaded) {
            try {
              $releases = Invoke-RestMethod "https://api.github.com/repos/zhongfly/mpv-winbuild/releases?per_page=5" -TimeoutSec 30
              $devAsset = $null
              foreach ($rel in $releases) {
                foreach ($asset in $rel.assets) {
                  if ($asset.name -match "mpv-dev-x86_64.*\.7z$") {
                    $devAsset = $asset; break
                  }
                }
                if ($devAsset) { break }
              }
              if ($devAsset) {
                Write-Host "소스 2 (zhongfly): $($devAsset.name)"
                Invoke-WebRequest -Uri $devAsset.browser_download_url -OutFile "mpv-dev.7z" -TimeoutSec 180
                $downloaded = $true
              }
            } catch {
              Write-Host "소스 2 실패: $_"
            }
          }

          if (-not $downloaded) {
            Write-Error "libmpv dev 패키지를 다운로드할 수 없습니다"
            exit 1
          }

          # 압축 해제
          7z x mpv-dev.7z -o"mpv-dev" -y | Out-Null

          # 파일 구조 확인
          Write-Host "=== mpv-dev 구조 ==="
          Get-ChildItem -Recurse mpv-dev | Select-Object -ExpandProperty FullName

      # ── libmpv 헤더 및 라이브러리 준비 ────────────────────────────
      - name: Prepare libmpv deps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps/libmpv/include/mpv | Out-Null
          New-Item -ItemType Directory -Force deps/libmpv/lib | Out-Null

          # 헤더 파일 복사
          $headers = Get-ChildItem -Recurse mpv-dev -Filter "*.h"
          foreach ($h in $headers) {
            Copy-Item $h.FullName deps/libmpv/include/mpv/
            Write-Host "헤더: $($h.Name)"
          }

          # DLL 복사
          $dll = Get-ChildItem -Recurse mpv-dev -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse mpv-dev -Filter "mpv-2.dll" | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Error "libmpv DLL을 찾을 수 없습니다"
            Get-ChildItem -Recurse mpv-dev -Filter "*.dll" | Select-Object FullName
            exit 1
          }
          Copy-Item $dll.FullName deps/libmpv/lib/libmpv-2.dll
          Write-Host "DLL: $($dll.Name)"

          # import library (.lib) 생성
          $existingLib = Get-ChildItem -Recurse mpv-dev -Filter "*.lib" | Select-Object -First 1
          if ($existingLib) {
            Copy-Item $existingLib.FullName deps/libmpv/lib/mpv.lib
            Write-Host "기존 .lib 사용: $($existingLib.Name)"
          } else {
            Write-Host "mpv.lib 생성 중..."
            $dumpbinOutput = & dumpbin /exports deps/libmpv/lib/libmpv-2.dll 2>&1
            $exports = $dumpbinOutput | Where-Object { $_ -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" } |
              ForEach-Object { [regex]::Match($_, "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)").Groups[1].Value }

            if ($exports.Count -eq 0) {
              Write-Error "DLL exports를 찾을 수 없습니다"
              exit 1
            }

            $defContent = @("LIBRARY libmpv-2", "EXPORTS")
            $defContent += $exports
            $defContent | Set-Content deps/libmpv/lib/libmpv-2.def -Encoding ASCII

            lib /def:deps/libmpv/lib/libmpv-2.def /out:deps/libmpv/lib/mpv.lib /machine:x64
            if ($LASTEXITCODE -ne 0) {
              Write-Error "lib.exe 실패"
              exit 1
            }
            Write-Host "mpv.lib 생성 완료"
          }

          Write-Host "=== deps/libmpv 구조 ==="
          Get-ChildItem -Recurse deps/libmpv | Select-Object FullName, Length


      # ── WebView2 SDK 다운로드 (OTT 스트리밍 - Netflix Dolby Atmos 지원) ──────
      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Write-Host "WebView2 SDK 다운로드 중..."
          try {
            $nupkgUrl = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45"
            Invoke-WebRequest -Uri $nupkgUrl -OutFile "webview2.nupkg" -TimeoutSec 120
            Rename-Item webview2.nupkg webview2.zip
            Expand-Archive webview2.zip -DestinationPath webview2-sdk -Force

            New-Item -ItemType Directory -Force deps/webview2/include | Out-Null
            New-Item -ItemType Directory -Force deps/webview2/lib/x64  | Out-Null

            Copy-Item webview2-sdk/build/native/include/*.h deps/webview2/include/
            Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll.lib deps/webview2/lib/x64/
            Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll     deps/webview2/lib/x64/

            Write-Host "WebView2 SDK 준비 완료"
            Get-ChildItem -Recurse deps/webview2 | Select-Object FullName
          } catch {
            Write-Host "WebView2 SDK 다운로드 실패 (OTT 기능 비활성화): $_"
          }

      # ── CMake 빌드 ────────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMPV_INCLUDE_DIR="${{ github.workspace }}/deps/libmpv/include" `
            -DMPV_LIB_DIR="${{ github.workspace }}/deps/libmpv/lib"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) {
            Write-Error "빌드 실패"
            exit 1
          }
          Write-Host "빌드 성공"
          Get-ChildItem build/Release/

      # ── 포터블 패키지 생성 ────────────────────────────────────────
      - name: Package Portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Sorinuri-Portable | Out-Null

          # 실행 파일
          Copy-Item build/Release/Sorinuri.exe dist/Sorinuri-Portable/

          # libmpv DLL
          Copy-Item deps/libmpv/lib/libmpv-2.dll dist/Sorinuri-Portable/

          # Qt DLL 배포 (windeployqt)
          $windeployqt = "$env:QT_ROOT_DIR/bin/windeployqt.exe"
          Write-Host "windeployqt: $windeployqt"
          & $windeployqt `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            dist/Sorinuri-Portable/Sorinuri.exe

          # ── 시작속도 최적화: qt.conf 생성 ──────────────────────────
          # 포터블 환경에서 플러그인 경로를 명시하여 탐색 시간 단축
          $qtConf = @"
          [Paths]
          Prefix = .
          Plugins = plugins
          Libraries = .
          "@
          $qtConf.Trim() | Set-Content dist/Sorinuri-Portable/qt.conf -Encoding UTF8

          # WebView2Loader.dll 복사 (OTT 스트리밍 지원)
          if (Test-Path "deps/webview2/lib/x64/WebView2Loader.dll") {
            Copy-Item "deps/webview2/lib/x64/WebView2Loader.dll" dist/Sorinuri-Portable/
            Write-Host "WebView2Loader.dll 복사 완료"
          }

          # yt-dlp 다운로드 (유튜브 5.1 서라운드 지원)
          Write-Host "yt-dlp 다운로드 중..."
          try {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
              -OutFile "dist/Sorinuri-Portable/yt-dlp.exe" -TimeoutSec 120
            Write-Host "yt-dlp 다운로드 완료: $([math]::Round((Get-Item dist/Sorinuri-Portable/yt-dlp.exe).Length/1MB,1)) MB"
          } catch {
            Write-Host "yt-dlp 다운로드 실패 (선택적 기능): $_"
          }

          # ffmpeg 다운로드 (화면 녹화 기능용)
          Write-Host "ffmpeg 다운로드 중..."
          try {
            # ffmpeg 최신 Windows 빌드 (gyan.dev 공식 빌드)
            $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg-build.zip" -TimeoutSec 180
            Expand-Archive -Path "ffmpeg-build.zip" -DestinationPath "ffmpeg-extract" -Force
            $ffmpegExe = Get-ChildItem -Path "ffmpeg-extract" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($ffmpegExe) {
              Copy-Item $ffmpegExe.FullName "dist/Sorinuri-Portable/ffmpeg.exe"
              Copy-Item $ffmpegExe.FullName "dist/ffmpeg.exe"
              Write-Host "ffmpeg 다운로드 완료: $([math]::Round((Get-Item dist/Sorinuri-Portable/ffmpeg.exe).Length/1MB,1)) MB"
            }
            Remove-Item "ffmpeg-build.zip", "ffmpeg-extract" -Recurse -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "ffmpeg 다운로드 실패 (선택적 기능): $_"
          }

          # Whisper ggml-base.bin 모델 다운로드 (v6.18.0 신규)
          try {
            Write-Host "Whisper 모델 다운로드 중..."
            New-Item -ItemType Directory -Path "dist/Sorinuri-Portable/models" -Force | Out-Null
            New-Item -ItemType Directory -Path "dist/models" -Force | Out-Null
            $whisperUrl = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
            Invoke-WebRequest -Uri $whisperUrl -OutFile "dist/Sorinuri-Portable/models/ggml-base.bin" -TimeoutSec 300
            Copy-Item "dist/Sorinuri-Portable/models/ggml-base.bin" "dist/models/ggml-base.bin"
            $modelSize = [math]::Round((Get-Item "dist/Sorinuri-Portable/models/ggml-base.bin").Length/1MB, 1)
            Write-Host "Whisper 모델 다운로드 완료: $modelSize MB"
          } catch {
            Write-Host "Whisper 모델 다운로드 실패 (선택적 기능): $_"
          }

          # vc_redist.x64.exe 다운로드 (Visual C++ 런타임 - 인스톨러에 포함)
          try {
            Write-Host "vc_redist 다운로드 중..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
              -OutFile "dist/vc_redist.x64.exe" -TimeoutSec 120
            Copy-Item "dist/vc_redist.x64.exe" "dist/Sorinuri-Portable/vc_redist.x64.exe"
            Write-Host "vc_redist 다운로드 완료: $([math]::Round((Get-Item dist/vc_redist.x64.exe).Length/1MB,1)) MB"
          } catch {
            Write-Host "vc_redist 다운로드 실패: $_"
          }

          # 디버그 배치 파일
          if (Test-Path "소리누리-디버그.bat") {
            Copy-Item "소리누리-디버그.bat" dist/Sorinuri-Portable/
          }

          # 패키지 크기 확인
          $size = (Get-ChildItem -Recurse dist/Sorinuri-Portable | Measure-Object -Property Length -Sum).Sum
          Write-Host "포터블 패키지 크기: $([math]::Round($size/1MB, 1)) MB"

          # ZIP 생성
          Compress-Archive -Path dist/Sorinuri-Portable -DestinationPath dist/Sorinuri-Qt-Portable.zip -Force
          Write-Host "포터블 ZIP: $([math]::Round((Get-Item dist/Sorinuri-Qt-Portable.zip).Length/1MB,1)) MB"

      # ── Microsoft Store MSIX (명시적 수동 실행만) ──────────────────
      # Partner Center 검증·앱 이름 예약 뒤 제공되는 identity 값이 없으면 절대 package하지 않는다.
      # Store는 제출 후 MSIX에 서명하므로 이 artifact를 고객에게 직접 배포하면 안 된다.
      - name: Build Microsoft Store MSIX
        if: github.event_name == 'workflow_dispatch' && inputs.build_store_msix == true
        shell: pwsh
        env:
          MSIX_PACKAGE_IDENTITY_NAME: ${{ vars.MSIX_PACKAGE_IDENTITY_NAME }}
          MSIX_PACKAGE_PUBLISHER: ${{ vars.MSIX_PACKAGE_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $required = @(
            @{ Name = 'MSIX_PACKAGE_IDENTITY_NAME'; Value = $env:MSIX_PACKAGE_IDENTITY_NAME },
            @{ Name = 'MSIX_PACKAGE_PUBLISHER'; Value = $env:MSIX_PACKAGE_PUBLISHER },
            @{ Name = 'MSIX_PUBLISHER_DISPLAY_NAME'; Value = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Name })
          if ($missing.Count -gt 0) {
            throw "Store MSIX 생성 중단: Partner Center에서 받은 repository variable이 누락됐습니다: $($missing -join ', ')"
          }

          cmake -B build-store -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSORINURI_STORE_BUILD=ON `
            -DMPV_INCLUDE_DIR="${{ github.workspace }}/deps/libmpv/include" `
            -DMPV_LIB_DIR="${{ github.workspace }}/deps/libmpv/lib"
          cmake --build build-store --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Store variant C++ build 실패' }

          Remove-Item 'dist/Sorinuri-StorePayload' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist/Sorinuri-Portable' 'dist/Sorinuri-StorePayload' -Recurse -Force
          Copy-Item 'build-store/Release/Sorinuri.exe' 'dist/Sorinuri-StorePayload/Sorinuri.exe' -Force
          Remove-Item 'dist/Sorinuri-StorePayload/vc_redist.x64.exe' -Force -ErrorAction SilentlyContinue
          Remove-Item 'dist/Sorinuri-StorePayload/소리누리-디버그.bat' -Force -ErrorAction SilentlyContinue

          $msixVersion = $env:MSIX_VERSION
          if ([string]::IsNullOrWhiteSpace($msixVersion) -or $msixVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Store MSIX 생성 중단: 검증된 MSIX_VERSION 환경값이 없습니다: $msixVersion"
          }
          & .\scripts\build_store_msix.ps1 `
            -PackageIdentityName $env:MSIX_PACKAGE_IDENTITY_NAME `
            -PackagePublisher $env:MSIX_PACKAGE_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME `
            -PackageVersion $msixVersion `
            -PayloadSource 'dist/Sorinuri-StorePayload' `
            -OutputDirectory 'dist'
          if ($LASTEXITCODE -ne 0) { throw 'Store MSIX archive 생성 실패' }

      # Store는 이 unsigned MSIX를 제출 후 재서명한다. GitHub artifact는 제출 담당자만
      # Partner Center에 업로드하는 중간 산출물이며 사용자 다운로드·자체 서버에는 게시하지 않는다.
      - name: Upload Microsoft Store submission package
        if: github.event_name == 'workflow_dispatch' && inputs.build_store_msix == true
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Microsoft-Store-MSIX-Submission
          path: dist/Sorinuri-Store-*-x64.msix
          retention-days: 14
          if-no-files-found: error

      # ── 로컬 PC 전용 self-signed MSIX (명시적 수동 실행만) ────────
      # PFX/private key는 CI runner에만 일시 생성 후 제거하며 artifact에 절대 포함하지 않는다.
      # 이 artifact는 Partner Center·GitHub Release·sorinuri.com 배포 대상이 아니다.
      - name: Build local self-signed MSIX test package
        if: github.event_name == 'workflow_dispatch' && inputs.build_local_test_msix == true
        shell: pwsh
        run: |
          cmake -B build-local-test -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSORINURI_STORE_BUILD=ON `
            -DMPV_INCLUDE_DIR="${{ github.workspace }}/deps/libmpv/include" `
            -DMPV_LIB_DIR="${{ github.workspace }}/deps/libmpv/lib"
          cmake --build build-local-test --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw '로컬 테스트 variant C++ build 실패' }

          Remove-Item 'dist/Sorinuri-LocalTestPayload' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'dist/Sorinuri-Portable' 'dist/Sorinuri-LocalTestPayload' -Recurse -Force
          Copy-Item 'build-local-test/Release/Sorinuri.exe' 'dist/Sorinuri-LocalTestPayload/Sorinuri.exe' -Force
          Remove-Item 'dist/Sorinuri-LocalTestPayload/vc_redist.x64.exe' -Force -ErrorAction SilentlyContinue
          Remove-Item 'dist/Sorinuri-LocalTestPayload/소리누리-디버그.bat' -Force -ErrorAction SilentlyContinue

          $msixVersion = $env:MSIX_VERSION
          if ([string]::IsNullOrWhiteSpace($msixVersion) -or $msixVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Store MSIX 생성 중단: 검증된 MSIX_VERSION 환경값이 없습니다: $msixVersion"
          }
          & .\scripts\build_local_test_msix.ps1 `
            -PackageVersion $msixVersion `
            -PayloadSource 'dist/Sorinuri-LocalTestPayload' `
            -OutputDirectory 'dist-local-test' `
            -CertificateValidityDays 14
          if ($LASTEXITCODE -ne 0) { throw '로컬 self-signed MSIX 생성 실패' }

          # full-trust C++ runtime dependency: 최신 Windows에 없을 때만 Install script가 설치한다.
          Invoke-WebRequest -Uri 'https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx' `
            -OutFile 'dist-local-test/Microsoft.VCLibs.x64.14.00.Desktop.appx' -TimeoutSec 120
          if (-not (Test-Path 'dist-local-test/Microsoft.VCLibs.x64.14.00.Desktop.appx')) {
            throw '로컬 테스트 VCLibs dependency 다운로드 실패'
          }
          Compress-Archive -Path 'dist-local-test/*' `
            -DestinationPath "dist/Sorinuri-LOCAL-TEST-NOT-FOR-DISTRIBUTION-$msixVersion.zip" -Force

      - name: Upload local self-signed test package
        if: github.event_name == 'workflow_dispatch' && inputs.build_local_test_msix == true
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-LOCAL-TEST-NOT-FOR-DISTRIBUTION
          path: dist/Sorinuri-LOCAL-TEST-NOT-FOR-DISTRIBUTION-*.zip
          retention-days: 3
          if-no-files-found: error

      # ── Inno Setup 설치파일 생성 ──────────────────────────────────
      # 액션이 공식 고정 릴리즈를 무인 설치·호출하므로 숨은 설치 창 대기를 피한다.
      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/sorinuri-setup.iss
          install_latest: true
          installer_url: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe

      - name: Verify Installer Package
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "Sorinuri-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "설치파일을 찾을 수 없습니다"
            Get-ChildItem dist/
            exit 1
          }
          Write-Host "설치파일 생성: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

      # ── Artifact 업로드 (포터블 + 설치파일) ─────────────────────
      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Qt-Windows-Portable
          path: dist/Sorinuri-Qt-Portable.zip
          retention-days: 30

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Qt-Windows-Installer
          path: dist/Sorinuri-Setup-*.exe
          retention-days: 30

      # ── 하위 호환성: 기존 아티팩트 이름도 유지 ───────────────────
      - name: Upload Legacy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Qt-Windows
          path: dist/Sorinuri-Qt-Portable.zip
          retention-days: 30

      # ── 서버 직접 배포 (GitHub Actions → sorinuri.com) ──────────
      - name: Upload artifacts for deploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-files
          path: |
            dist/Sorinuri-Qt-Portable.zip
            dist/Sorinuri-Setup-*.exe
          retention-days: 1

  # 레거시 스테이징 배포 경로: 파일명·메타데이터·SSH 시크릿 체계가 현재
  # 원자적 자체 서버 릴리즈 게시 방식과 다르므로 사용하지 않는다.
  # 실제 서버 배포는 release.yml의 publish-to-sorinuri 작업만 담당한다.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-files
          path: dist/

      - name: Generate version-staging.json
        env:
          APP_VERSION: "6.20.7"
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: python3 scripts/make_version_json.py "$APP_VERSION" "$DEPLOY_HOST" staging

      - name: Deploy to Server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_VERSION: "6.20.7"
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "배포 Secrets 미설정 - 건너뜀"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # sorinuri.com DocumentRoot: /var/www/sorinuri
          REAL_PATH="/var/www/sorinuri/downloads"

          # downloads 폴더 생성
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p $REAL_PATH && chmod 755 $REAL_PATH"

          echo "포터블 배포 중..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            dist/Sorinuri-Qt-Portable.zip \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REAL_PATH}/Sorinuri-Qt-${APP_VERSION}.zip"

          echo "설치파일 배포 중..."
          INSTALLER=$(ls dist/Sorinuri-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$INSTALLER" ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$INSTALLER" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${REAL_PATH}/Sorinuri-Setup-${APP_VERSION}.exe"
          fi

          # version-staging.json 배포 (테스트용 - 자동 업데이트에 연결 안 됨)
          # 확정 후 promote 워크플로우를 실행해야 version.json에 반영됨
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/version-staging.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REAL_PATH}/version-staging.json"
          echo "[STAGING] version-staging.json 배포 완료"
          echo "테스트 후 확정하려면 promote 워크플로우를 실행하세요"

          # 배포 확인
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "ls -lh $REAL_PATH/"
          echo "배포 완료"
