name: Build Windows (Qt6 + libmpv)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      # ── 소스 체크아웃 ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Visual Studio 환경 설정 ────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Qt6 설치 ───────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: ''
          cache: true

      # ── libmpv 다운로드 ────────────────────────────────────────────
      - name: Download libmpv
        shell: pwsh
        run: |
          # 여러 소스를 시도하는 방식으로 안정성 확보
          $downloaded = $false

          # 소스 1: shinchiro
          try {
            $releases = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases?per_page=5" -TimeoutSec 30
            $devAsset = $null
            foreach ($rel in $releases) {
              foreach ($asset in $rel.assets) {
                if ($asset.name -match "mpv-dev-x86_64.*\.7z$") {
                  $devAsset = $asset; break
                }
              }
              if ($devAsset) { break }
            }
            if ($devAsset) {
              Write-Host "소스 1 (shinchiro): $($devAsset.name)"
              Invoke-WebRequest -Uri $devAsset.browser_download_url -OutFile "mpv-dev.7z" -TimeoutSec 180
              $downloaded = $true
            }
          } catch {
            Write-Host "소스 1 실패: $_"
          }

          # 소스 2: zhongfly (shinchiro 실패 시 대체)
          if (-not $downloaded) {
            try {
              $releases = Invoke-RestMethod "https://api.github.com/repos/zhongfly/mpv-winbuild/releases?per_page=5" -TimeoutSec 30
              $devAsset = $null
              foreach ($rel in $releases) {
                foreach ($asset in $rel.assets) {
                  if ($asset.name -match "mpv-dev-x86_64.*\.7z$") {
                    $devAsset = $asset; break
                  }
                }
                if ($devAsset) { break }
              }
              if ($devAsset) {
                Write-Host "소스 2 (zhongfly): $($devAsset.name)"
                Invoke-WebRequest -Uri $devAsset.browser_download_url -OutFile "mpv-dev.7z" -TimeoutSec 180
                $downloaded = $true
              }
            } catch {
              Write-Host "소스 2 실패: $_"
            }
          }

          if (-not $downloaded) {
            Write-Error "libmpv dev 패키지를 다운로드할 수 없습니다"
            exit 1
          }

          # 압축 해제
          7z x mpv-dev.7z -o"mpv-dev" -y | Out-Null

          # 파일 구조 확인
          Write-Host "=== mpv-dev 구조 ==="
          Get-ChildItem -Recurse mpv-dev | Select-Object -ExpandProperty FullName

      # ── libmpv 헤더 및 라이브러리 준비 ────────────────────────────
      - name: Prepare libmpv deps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps/libmpv/include/mpv | Out-Null
          New-Item -ItemType Directory -Force deps/libmpv/lib | Out-Null

          # 헤더 파일 복사
          $headers = Get-ChildItem -Recurse mpv-dev -Filter "*.h"
          foreach ($h in $headers) {
            Copy-Item $h.FullName deps/libmpv/include/mpv/
            Write-Host "헤더: $($h.Name)"
          }

          # DLL 복사
          $dll = Get-ChildItem -Recurse mpv-dev -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse mpv-dev -Filter "mpv-2.dll" | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Error "libmpv DLL을 찾을 수 없습니다"
            Get-ChildItem -Recurse mpv-dev -Filter "*.dll" | Select-Object FullName
            exit 1
          }
          Copy-Item $dll.FullName deps/libmpv/lib/libmpv-2.dll
          Write-Host "DLL: $($dll.Name)"

          # import library (.lib) 생성
          $existingLib = Get-ChildItem -Recurse mpv-dev -Filter "*.lib" | Select-Object -First 1
          if ($existingLib) {
            Copy-Item $existingLib.FullName deps/libmpv/lib/mpv.lib
            Write-Host "기존 .lib 사용: $($existingLib.Name)"
          } else {
            Write-Host "mpv.lib 생성 중..."
            $dumpbinOutput = & dumpbin /exports deps/libmpv/lib/libmpv-2.dll 2>&1
            $exports = $dumpbinOutput | Where-Object { $_ -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" } |
              ForEach-Object { [regex]::Match($_, "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)").Groups[1].Value }

            if ($exports.Count -eq 0) {
              Write-Error "DLL exports를 찾을 수 없습니다"
              exit 1
            }

            $defContent = @("LIBRARY libmpv-2", "EXPORTS")
            $defContent += $exports
            $defContent | Set-Content deps/libmpv/lib/libmpv-2.def -Encoding ASCII

            lib /def:deps/libmpv/lib/libmpv-2.def /out:deps/libmpv/lib/mpv.lib /machine:x64
            if ($LASTEXITCODE -ne 0) {
              Write-Error "lib.exe 실패"
              exit 1
            }
            Write-Host "mpv.lib 생성 완료"
          }

          Write-Host "=== deps/libmpv 구조 ==="
          Get-ChildItem -Recurse deps/libmpv | Select-Object FullName, Length


      # ── WebView2 SDK 다운로드 (OTT 스트리밍 - Netflix Dolby Atmos 지원) ──────
      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Write-Host "WebView2 SDK 다운로드 중..."
          try {
            $nupkgUrl = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45"
            Invoke-WebRequest -Uri $nupkgUrl -OutFile "webview2.nupkg" -TimeoutSec 120
            Rename-Item webview2.nupkg webview2.zip
            Expand-Archive webview2.zip -DestinationPath webview2-sdk -Force

            New-Item -ItemType Directory -Force deps/webview2/include | Out-Null
            New-Item -ItemType Directory -Force deps/webview2/lib/x64  | Out-Null

            Copy-Item webview2-sdk/build/native/include/*.h deps/webview2/include/
            Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll.lib deps/webview2/lib/x64/
            Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll     deps/webview2/lib/x64/

            Write-Host "WebView2 SDK 준비 완료"
            Get-ChildItem -Recurse deps/webview2 | Select-Object FullName
          } catch {
            Write-Host "WebView2 SDK 다운로드 실패 (OTT 기능 비활성화): $_"
          }

      # ── CMake 빌드 ────────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMPV_INCLUDE_DIR="${{ github.workspace }}/deps/libmpv/include" `
            -DMPV_LIB_DIR="${{ github.workspace }}/deps/libmpv/lib"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) {
            Write-Error "빌드 실패"
            exit 1
          }
          Write-Host "빌드 성공"
          Get-ChildItem build/Release/

      # ── 포터블 패키지 생성 ────────────────────────────────────────
      - name: Package Portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Sorinuri-Portable | Out-Null

          # 실행 파일
          Copy-Item build/Release/Sorinuri.exe dist/Sorinuri-Portable/

          # libmpv DLL
          Copy-Item deps/libmpv/lib/libmpv-2.dll dist/Sorinuri-Portable/

          # Qt DLL 배포 (windeployqt)
          $windeployqt = "$env:QT_ROOT_DIR/bin/windeployqt.exe"
          Write-Host "windeployqt: $windeployqt"
          & $windeployqt `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            dist/Sorinuri-Portable/Sorinuri.exe

          # ── 시작속도 최적화: qt.conf 생성 ──────────────────────────
          # 포터블 환경에서 플러그인 경로를 명시하여 탐색 시간 단축
          $qtConf = @"
          [Paths]
          Prefix = .
          Plugins = plugins
          Libraries = .
          "@
          $qtConf.Trim() | Set-Content dist/Sorinuri-Portable/qt.conf -Encoding UTF8

          # WebView2Loader.dll 복사 (OTT 스트리밍 지원)
          if (Test-Path "deps/webview2/lib/x64/WebView2Loader.dll") {
            Copy-Item "deps/webview2/lib/x64/WebView2Loader.dll" dist/Sorinuri-Portable/
            Write-Host "WebView2Loader.dll 복사 완료"
          }

          # yt-dlp 다운로드 (유튜브 5.1 서라운드 지원)
          Write-Host "yt-dlp 다운로드 중..."
          try {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
              -OutFile "dist/Sorinuri-Portable/yt-dlp.exe" -TimeoutSec 120
            Write-Host "yt-dlp 다운로드 완료: $([math]::Round((Get-Item dist/Sorinuri-Portable/yt-dlp.exe).Length/1MB,1)) MB"
          } catch {
            Write-Host "yt-dlp 다운로드 실패 (선택적 기능): $_"
          }

          # 디버그 배치 파일
          if (Test-Path "소리누리-디버그.bat") {
            Copy-Item "소리누리-디버그.bat" dist/Sorinuri-Portable/
          }

          # 패키지 크기 확인
          $size = (Get-ChildItem -Recurse dist/Sorinuri-Portable | Measure-Object -Property Length -Sum).Sum
          Write-Host "포터블 패키지 크기: $([math]::Round($size/1MB, 1)) MB"

          # ZIP 생성
          Compress-Archive -Path dist/Sorinuri-Portable -DestinationPath dist/Sorinuri-Qt-Portable.zip -Force
          Write-Host "포터블 ZIP: $([math]::Round((Get-Item dist/Sorinuri-Qt-Portable.zip).Length/1MB,1)) MB"

      # ── Inno Setup 설치파일 생성 ──────────────────────────────────
      - name: Build Installer
        shell: pwsh
        run: |
          # Inno Setup 설치 확인 (windows-2022 runner에 기본 포함)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Inno Setup 다운로드 및 설치
            Write-Host "Inno Setup 설치 중..."
            $url = "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe"
            Invoke-WebRequest -Uri $url -OutFile "innosetup.exe" -TimeoutSec 120
            Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
            Write-Host "Inno Setup 설치 완료"
          }

          # Korean.isl 언어 파일 확인
          $koreanIsl = "C:\Program Files (x86)\Inno Setup 6\Languages\Korean.isl"
          if (-not (Test-Path $koreanIsl)) {
            Write-Host "Korean.isl 없음 - 영어로 대체"
            # ISS 파일에서 Korean 언어 라인 제거
            $issContent = Get-Content installer/sorinuri-setup.iss -Raw
            $issContent = $issContent -replace 'Name: "korean";.*\n', ''
            $issContent | Set-Content installer/sorinuri-setup-en.iss -Encoding UTF8
            $issFile = "installer/sorinuri-setup-en.iss"
          } else {
            $issFile = "installer/sorinuri-setup.iss"
          }

          # 설치파일 빌드
          & $iscc $issFile
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup 빌드 실패"
            exit 1
          }

          # 결과 확인
          $installer = Get-ChildItem dist -Filter "Sorinuri-Setup-*.exe" | Select-Object -First 1
          if ($installer) {
            Write-Host "설치파일 생성: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"
          } else {
            Write-Error "설치파일을 찾을 수 없습니다"
            Get-ChildItem dist/
            exit 1
          }

      # ── Artifact 업로드 (포터블 + 설치파일) ─────────────────────
      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Qt-Windows-Portable
          path: dist/Sorinuri-Qt-Portable.zip
          retention-days: 30

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Qt-Windows-Installer
          path: dist/Sorinuri-Setup-*.exe
          retention-days: 30

      # ── 하위 호환성: 기존 아티팩트 이름도 유지 ───────────────────
      - name: Upload Legacy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sorinuri-Qt-Windows
          path: dist/Sorinuri-Qt-Portable.zip
          retention-days: 30

      # ── 서버 직접 배포 (GitHub Actions → sorinuri.com) ──────────
      - name: Upload artifacts for deploy
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-files
          path: |
            dist/Sorinuri-Qt-Portable.zip
            dist/Sorinuri-Setup-*.exe
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-files
          path: dist/

      - name: Generate version.json
        env:
          APP_VERSION: "4.2.9"
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: python3 scripts/make_version_json.py "$APP_VERSION" "$DEPLOY_HOST"

      - name: Deploy to Server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_VERSION: "4.2.9"
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "배포 Secrets 미설정 - 건너뜀"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # sorinuri.com DocumentRoot: /var/www/sorinuri
          REAL_PATH="/var/www/sorinuri/downloads"

          # downloads 폴더 생성
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p $REAL_PATH && chmod 755 $REAL_PATH"

          echo "포터블 배포 중..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            dist/Sorinuri-Qt-Portable.zip \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REAL_PATH}/Sorinuri-Qt-${APP_VERSION}.zip"

          echo "설치파일 배포 중..."
          INSTALLER=$(ls dist/Sorinuri-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$INSTALLER" ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$INSTALLER" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${REAL_PATH}/Sorinuri-Setup-${APP_VERSION}.exe"
          fi

          # version.json 생성 및 배포 (자동 업데이트용)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/version.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REAL_PATH}/version.json"

          # 배포 확인
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "ls -lh $REAL_PATH/"
          echo "배포 완료"
