name: Release (태그 push 시 GitHub Release 자동 생성)

on:
  push:
    tags:
      - 'v*.*.*'   # v4.2.0, v4.3.0 등 태그 push 시 트리거
  workflow_dispatch:
    inputs:
      version_tag:
        description: '빌드할 태그 (refs/tags/vX.Y.Z 형식)'
        required: true
        default: 'v6.11.3'

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write   # GitHub Release 생성 권한

    steps:
      # ── 소스 체크아웃 ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 릴리즈 게이트가 직전 태그 이후의 변경 파일을 비교해야 한다.
          fetch-depth: 0

      # ── 버전 추출 ─────────────────────────────────────────────────
      - name: Extract version
        id: version
        shell: bash
        run: |
          # workflow_dispatch 시 inputs.version_tag 사용, 태그 push 시 GITHUB_REF 사용
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "릴리스 버전: $VERSION (TAG: $TAG)"

      # ── CHANGELOG에서 이번 버전 릴리스 노트 추출 ─────────────────
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # CHANGELOG.md에서 해당 버전 섹션 추출
          NOTES=$(awk "/^## \[v${VERSION}\]/{found=1; next} found && /^## \[v/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="소리누리 v${VERSION} 릴리스"
          fi
          # 멀티라인 output 처리
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ── 릴리즈 변경 범위 게이트 ────────────────────────────────────
      - name: Verify declared release scope
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_release_gate.py

      # ── 사전 테스트 배포·production 격리 검증 ───────────────────────
      - name: Verify pre-production test release isolation
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_preproduction_test_release.py

      # ── 멀티채널 출력 정책 회귀 검증 ──────────────────────────────
      - name: Verify multichannel audio policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_audio_policy.py

      - name: Verify multi-instance shared PCM policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_multi_instance_audio.py

      # ── 절전 복귀 오디오·새 파일 자막 스타일 회귀 검증 ───────────────
      - name: Verify audio resume and subtitle lifecycle
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_audio_resume_subtitle.py

      # ── 첫 프레임·지연 MPV 초기화·초기 파일 재생 회귀 검증 ───────────
      - name: Verify startup responsiveness
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_startup_responsiveness.py

      # ── Windows Snap·유휴 반응성 회귀 검증 ───────────────────────────
      - name: Verify Windows Snap and idle responsiveness
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_window_snap_responsiveness.py

      # ── 통합 디자인 시스템·HiDPI 버튼 포커스 검증 ─────────────────────
      - name: Verify unified UI design system
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_ui_design_system.py

      # ── 파일 연결·Windows 기본 앱 등록 검증 ──────────────────────────
      - name: Verify file association policy
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_file_associations.py

      # ── 자동 업데이트 설치 경로·실행 실패 복구 검증 ───────────────────
      - name: Verify update installation flow
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_update_install_flow.py

      # ── 통합 재생 대기열·YouTube·반복 모드 회귀 검증 ──────────────────
      - name: Verify unified playback queue
        shell: bash
        run: PYTHONUTF8=1 python3 scripts/verify_playback_queue.py

      # ── Visual Studio 환경 설정 ────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Qt6 설치 ───────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          cache: true

      # ── libmpv 다운로드 (shinchiro → zhongfly 폴백) ──────────────
      - name: Download libmpv
        shell: pwsh
        run: |
          $downloaded = $false
          # 소스 1: shinchiro
          try {
            $releases = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases?per_page=5" -TimeoutSec 30
            $devAsset = $null
            foreach ($rel in $releases) {
              foreach ($asset in $rel.assets) {
                if ($asset.name -match "mpv-dev-x86_64.*\.7z$") {
                  $devAsset = $asset; break
                }
              }
              if ($devAsset) { break }
            }
            if ($devAsset) {
              Write-Host "소스 1 (shinchiro): $($devAsset.name)"
              Invoke-WebRequest -Uri $devAsset.browser_download_url -OutFile "mpv-dev.7z" -TimeoutSec 180
              $downloaded = $true
            }
          } catch {
            Write-Host "소스 1 실패: $_"
          }
          # 소스 2: zhongfly (shinchiro 실패 시 대체)
          if (-not $downloaded) {
            try {
              $releases = Invoke-RestMethod "https://api.github.com/repos/zhongfly/mpv-winbuild/releases?per_page=5" -TimeoutSec 30
              $devAsset = $null
              foreach ($rel in $releases) {
                foreach ($asset in $rel.assets) {
                  if ($asset.name -match "mpv-dev-x86_64.*\.7z$") {
                    $devAsset = $asset; break
                  }
                }
                if ($devAsset) { break }
              }
              if ($devAsset) {
                Write-Host "소스 2 (zhongfly): $($devAsset.name)"
                Invoke-WebRequest -Uri $devAsset.browser_download_url -OutFile "mpv-dev.7z" -TimeoutSec 180
                $downloaded = $true
              }
            } catch {
              Write-Host "소스 2 실패: $_"
            }
          }
          if (-not $downloaded) {
            Write-Error "libmpv dev 패키지를 다운로드할 수 없습니다"
            exit 1
          }
          7z x mpv-dev.7z -o"mpv-dev" -y | Out-Null
          Get-ChildItem -Recurse mpv-dev | Select-Object -ExpandProperty FullName

      # ── libmpv 헤더 및 라이브러리 준비 ────────────────────────────
      - name: Prepare libmpv deps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps/libmpv/include/mpv | Out-Null
          New-Item -ItemType Directory -Force deps/libmpv/lib | Out-Null
          $headers = Get-ChildItem -Recurse mpv-dev -Filter "*.h"
          foreach ($h in $headers) { Copy-Item $h.FullName deps/libmpv/include/mpv/ }
          $dll = Get-ChildItem -Recurse mpv-dev -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Recurse mpv-dev -Filter "mpv-2.dll" | Select-Object -First 1 }
          if (-not $dll) { Write-Error "libmpv DLL 없음"; exit 1 }
          Copy-Item $dll.FullName deps/libmpv/lib/libmpv-2.dll
          $existingLib = Get-ChildItem -Recurse mpv-dev -Filter "*.lib" | Select-Object -First 1
          if ($existingLib) {
            Copy-Item $existingLib.FullName deps/libmpv/lib/mpv.lib
          } else {
            $dumpbinOutput = & dumpbin /exports deps/libmpv/lib/libmpv-2.dll 2>&1
            $exports = $dumpbinOutput | Where-Object { $_ -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" } |
              ForEach-Object { [regex]::Match($_, "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)").Groups[1].Value }
            $defContent = @("LIBRARY libmpv-2", "EXPORTS") + $exports
            $defContent | Set-Content deps/libmpv/lib/libmpv-2.def -Encoding ASCII
            lib /def:deps/libmpv/lib/libmpv-2.def /out:deps/libmpv/lib/mpv.lib /machine:x64
          }
          Get-ChildItem -Recurse deps/libmpv | Select-Object FullName, Length

      # ── WebView2 SDK 다운로드 ──────────────────────────────────────
      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          try {
            $nupkgUrl = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45"
            Invoke-WebRequest -Uri $nupkgUrl -OutFile "webview2.nupkg" -TimeoutSec 120
            Rename-Item webview2.nupkg webview2.zip
            Expand-Archive webview2.zip -DestinationPath webview2-sdk -Force
            New-Item -ItemType Directory -Force deps/webview2/include | Out-Null
            New-Item -ItemType Directory -Force deps/webview2/lib/x64  | Out-Null
            Copy-Item webview2-sdk/build/native/include/*.h deps/webview2/include/
            Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll.lib deps/webview2/lib/x64/
            Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll     deps/webview2/lib/x64/
            Write-Host "WebView2 SDK 준비 완료"
          } catch {
            Write-Host "WebView2 SDK 다운로드 실패 (OTT 기능 비활성화): $_"
          }

      # ── CMake 빌드 ────────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DMPV_INCLUDE_DIR="$PWD/deps/libmpv/include" `
            -DMPV_LIB_DIR="$PWD/deps/libmpv/lib" `
            -DWEBVIEW2_SDK_DIR="$PWD/deps/webview2"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ── 포터블 패키지 생성 ────────────────────────────────────────
      - name: Package Portable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist/Sorinuri-Portable" | Out-Null
          Copy-Item "build/Release/Sorinuri.exe" "dist/Sorinuri-Portable/" -Force
          $mpvDll = Get-ChildItem deps/libmpv -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1
          if ($mpvDll) { Copy-Item $mpvDll.FullName "dist/Sorinuri-Portable/" -Force }
          $wv2Dll = Get-ChildItem deps/webview2 -Filter "WebView2Loader.dll" -Recurse | Select-Object -First 1
          if ($wv2Dll) { Copy-Item $wv2Dll.FullName "dist/Sorinuri-Portable/" -Force }
          # yt-dlp 다운로드
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/Sorinuri-Portable/yt-dlp.exe" -TimeoutSec 120
          # Qt DLL 배포
          $windeployqt = "$env:QT_ROOT_DIR/bin/windeployqt.exe"
          & $windeployqt `
            --no-translations --no-system-d3d-compiler `
            "dist/Sorinuri-Portable/Sorinuri.exe"
          # vc_redist.x64.exe 다운로드 (Visual C++ 런타임 - 인스톨러에 포함)
          try {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
              -OutFile "dist/vc_redist.x64.exe" -TimeoutSec 120
            Copy-Item "dist/vc_redist.x64.exe" "dist/Sorinuri-Portable/vc_redist.x64.exe"
            Write-Host "vc_redist: $([math]::Round((Get-Item dist/vc_redist.x64.exe).Length/1MB,1)) MB"
          } catch { Write-Host "vc_redist 다운로드 실패: $_" }
          Compress-Archive -Path "dist/Sorinuri-Portable/*" `
            -DestinationPath "dist/Sorinuri-Qt-$version-Portable.zip" -Force
          if (-not (Test-Path "dist/Sorinuri-Qt-$version-Portable.zip")) {
            throw "포터블 패키지 생성 실패"
          }

      # ── 설치파일 생성 ─────────────────────────────────────────────
      # 액션이 공식 고정 릴리즈를 무인 설치·호출하므로 숨은 설치 창 대기를 피한다.
      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/sorinuri-setup.iss
          install_latest: true
          installer_url: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe

      - name: Verify Installer Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if (-not (Test-Path "dist\Sorinuri-Setup-$version.exe")) {
            Write-Error "설치파일을 찾을 수 없습니다"
            Get-ChildItem dist/
            exit 1
          }

      # ── 기존 자체 서명: 설치 EXE ────────────────────────────────────
      # 기존 v6.19.7 방식과 동일하게 GitHub 호스팅 Windows runner에서 단기 인증서를 만들고,
      # 개인 키·외부 코드 서명 서비스·Azure 자격 증명을 저장소에 추가하지 않는다.
      - name: Code sign installer with existing self-signed policy
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installerPath = "dist\Sorinuri-Setup-$version.exe"
          $cert = New-SelfSignedCertificate `
            -Subject "CN=Gaon Communication, O=Gaon Communication, L=Seoul, C=KR" `
            -Type CodeSigningCert `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(3)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "Windows SDK signtool.exe를 찾을 수 없습니다." }
          $result = & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $cert.Thumbprint $installerPath 2>&1
          if ($LASTEXITCODE -ne 0) { throw "기존 자체 서명 정책의 설치 EXE 서명에 실패했습니다." }
          @(
            "version=$version"
            "installer_sha256=$((Get-FileHash -Algorithm SHA256 $installerPath).Hash)"
            "signing_mode=self-signed-existing-policy"
          ) | Set-Content "dist\signing-manifest-portable.txt" -Encoding utf8

      # ── 사전 테스트 패키지 전달 ───────────────────────────────────
      # draft GitHub Release는 공개 전 자산 다운로드 제약이 있으므로, 같은 워크플로우의
      # 검증된 패키지를 내부 산출물로 전달한다.
      - name: Upload pre-production package
        uses: actions/upload-artifact@v4
        with:
          name: sorinuri-preproduction-${{ steps.version.outputs.version }}
          path: |
            dist/Sorinuri-Qt-${{ steps.version.outputs.version }}-Portable.zip
            dist/Sorinuri-Setup-${{ steps.version.outputs.version }}.exe
            dist/signing-manifest-portable.txt
          if-no-files-found: error
          retention-days: 14

      # ── GitHub Release 생성 ───────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "소리누리 ${{ steps.version.outputs.tag }}"
          body: |
            ## 소리누리 ${{ steps.version.outputs.tag }}

            ${{ steps.notes.outputs.notes }}

            ---

            ### 다운로드
            | 파일 | 설명 |
            |------|------|
            | `Sorinuri-Qt-${{ steps.version.outputs.version }}-Portable.zip` | 압축 해제 후 바로 실행 (설치 불필요) |
            | `Sorinuri-Setup-${{ steps.version.outputs.version }}.exe` | 설치 마법사 (파일 연결, 시작 메뉴 등록) |

            ### 시스템 요구사항
            - Windows 10 / 11 (64-bit)
            - Microsoft Edge (WebView2 런타임, Windows 기본 설치)
            - Dolby Atmos 출력: HDMI/광출력 연결 + Dolby Access 앱 (Microsoft Store 무료)
          files: |
            dist/Sorinuri-Qt-${{ steps.version.outputs.version }}-Portable.zip
            dist/Sorinuri-Setup-${{ steps.version.outputs.version }}.exe
          # 실장비 테스트가 끝나기 전에는 GitHub 릴리즈도 공개하지 않는다.
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── 사전 테스트 게시: 정식 다운로드·자동 업데이트와 완전히 분리 ───────────
  publish-test-to-sorinuri:
    needs: release
    runs-on: ubuntu-24.04
    # 여기에는 production 환경 승인이 없다. /testing/<version>/ 만 원자적으로 갱신한다.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Determine test version
        id: test_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare secure SSH publishing
        shell: bash
        env:
          SORINURI_KNOWN_HOSTS: ${{ secrets.SORINURI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SORINURI_KNOWN_HOSTS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SORINURI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download packaged test assets
        uses: actions/download-artifact@v4
        with:
          name: sorinuri-preproduction-${{ steps.test_version.outputs.version }}
          path: release-assets

      - name: Prepare test release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.test_version.outputs.version }}"
          awk "/^## \[v${VERSION}\]/{found=1; next} found && /^## \[v/{exit} found{print}" CHANGELOG.md \
            > release-assets/release-notes.txt
          test -s release-assets/release-notes.txt || echo "소리누리 v${VERSION} 사전 테스트" > release-assets/release-notes.txt

      - name: Publish pre-production test package
        shell: bash
        env:
          SORINURI_DEPLOY_HOST: ${{ secrets.SORINURI_DEPLOY_HOST }}
          SORINURI_DEPLOY_USER: ${{ secrets.SORINURI_DEPLOY_USER }}
          SORINURI_DEPLOY_PASSWORD: ${{ secrets.SORINURI_DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.test_version.outputs.version }}"
          chmod +x scripts/publish_self_hosted_test_release.sh
          scripts/publish_self_hosted_test_release.sh "$VERSION" release-assets release-assets/release-notes.txt

      - name: Verify isolated test package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.test_version.outputs.version }}"
          BASE="https://sorinuri.com/downloads/testing/${VERSION}"
          curl --fail --silent --show-error --location --range 0-0 \
            -o /dev/null "$BASE/Sorinuri-Setup-${VERSION}.exe"
          curl --fail --silent --show-error --location --range 0-0 \
            -o /dev/null "$BASE/Sorinuri-Qt-${VERSION}-Portable.zip"
          test "$(curl --fail --silent --show-error "$BASE/TESTING-ONLY.txt" | wc -c)" -gt 0


  # ── 정식 게시: 사전 테스트 성공 뒤 사용자 production 승인 시에만 실행 ───────
  publish-to-sorinuri:
    needs: [release, publish-test-to-sorinuri]
    runs-on: ubuntu-24.04
    # 승인 전에는 설치파일·자동 업데이트 메타데이터를 운영 서버에 게시하지 않는다.
    environment:
      name: sorinuri-production
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Determine published version
        id: self_host_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare secure SSH publishing
        shell: bash
        env:
          SORINURI_KNOWN_HOSTS: ${{ secrets.SORINURI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SORINURI_KNOWN_HOSTS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SORINURI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.self_host_version.outputs.version }}"
          mkdir -p release-assets
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "Sorinuri-Setup-${VERSION}.exe" \
            --pattern "Sorinuri-Qt-${VERSION}-Portable.zip" \
            --dir release-assets
          awk "/^## \[v${VERSION}\]/{found=1; next} found && /^## \[v/{exit} found{print}" CHANGELOG.md \
            > release-assets/release-notes.txt
          test -s release-assets/release-notes.txt || echo "소리누리 v${VERSION} 릴리스" > release-assets/release-notes.txt

      - name: Publish to sorinuri.com
        shell: bash
        env:
          SORINURI_DEPLOY_HOST: ${{ secrets.SORINURI_DEPLOY_HOST }}
          SORINURI_DEPLOY_USER: ${{ secrets.SORINURI_DEPLOY_USER }}
          SORINURI_DEPLOY_PASSWORD: ${{ secrets.SORINURI_DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.self_host_version.outputs.version }}"
          chmod +x scripts/publish_self_hosted_release.sh
          scripts/publish_self_hosted_release.sh "$VERSION" release-assets release-assets/release-notes.txt

      - name: Publish approved landing page and release notes
        shell: bash
        env:
          SORINURI_DEPLOY_HOST: ${{ secrets.SORINURI_DEPLOY_HOST }}
          SORINURI_DEPLOY_USER: ${{ secrets.SORINURI_DEPLOY_USER }}
          SORINURI_DEPLOY_PASSWORD: ${{ secrets.SORINURI_DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.self_host_version.outputs.version }}"
          TITLE=$(python3 -c 'import json; print(next(x for x in json.load(open("scripts/releases_data.json", encoding="utf-8")) if x["version"] == "'"$VERSION"'")["title"])')
          DESC=$(python3 -c 'import json; print(next(x for x in json.load(open("scripts/releases_data.json", encoding="utf-8")) if x["version"] == "'"$VERSION"'")["desc"])')
          python3 scripts/update_landing.py "$VERSION" "$TITLE" "$DESC"
          TARGET="${SORINURI_DEPLOY_USER}@${SORINURI_DEPLOY_HOST}"
          sshpass -p "$SORINURI_DEPLOY_PASSWORD" scp -o StrictHostKeyChecking=yes \
            "/tmp/landing_${VERSION}.html" "$TARGET:/var/www/sorinuri/.index.html.new"
          sshpass -p "$SORINURI_DEPLOY_PASSWORD" scp -o StrictHostKeyChecking=yes \
            "/tmp/changelog_${VERSION}.html" "$TARGET:/var/www/sorinuri/.changelog.html.new"
          sshpass -p "$SORINURI_DEPLOY_PASSWORD" scp -o StrictHostKeyChecking=yes \
            scripts/releases_data.json "$TARGET:/var/www/sorinuri/.releases.json.new"
          sshpass -p "$SORINURI_DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=yes "$TARGET" \
            'mv -f /var/www/sorinuri/.index.html.new /var/www/sorinuri/index.html && \
             mv -f /var/www/sorinuri/.changelog.html.new /var/www/sorinuri/changelog.html && \
             mv -f /var/www/sorinuri/.releases.json.new /var/www/sorinuri/releases.json'

      - name: Verify public self-hosted release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.self_host_version.outputs.version }}"
          BASE="https://sorinuri.com/downloads"
          curl --fail --silent --show-error --location --range 0-0 \
            -o /dev/null "$BASE/Sorinuri-Setup-${VERSION}.exe"
          curl --fail --silent --show-error --location --range 0-0 \
            -o /dev/null "$BASE/Sorinuri-Qt-${VERSION}-Portable.zip"
          curl --fail --silent --show-error "$BASE/version.json" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == sys.argv[1]' "$VERSION"
